name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Select APK build type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.0"
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Java version
        run: java -version

      - name: Flutter clean
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Build Debug APK
        if: ${{ inputs.build_type == 'debug' }}
        run: flutter build apk --debug --target-platform android-arm64 --no-tree-shake-icons

      - name: Build Release APK
        if: ${{ inputs.build_type == 'release' }}
        run: flutter build apk --release --target-platform android-arm64 --no-tree-shake-icons

      - name: Upload Debug APK
        if: ${{ inputs.build_type == 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: mys-debug-arm64
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload Release APK
        if: ${{ inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: mys-release-arm64
          path: build/app/outputs/flutter-apk/app-release.apk
