name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Select build type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
          - bundle

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Java version
        run: java -version

      - name: Get dependencies
        run: flutter pub get

      # Debug APK - Split per ABI
      - name: Build Debug APK
        if: ${{ inputs.build_type == 'debug' }}
        run: flutter build apk --debug --split-per-abi

      # Release APK - Split per ABI
      - name: Build Release APK
        if: ${{ inputs.build_type == 'release' }}
        run: flutter build apk --release --split-per-abi

      # Release App Bundle
      - name: Build Release App Bundle
        if: ${{ inputs.build_type == 'bundle' }}
        run: flutter build appbundle --release

      # Upload Debug APKs
      - name: Upload Debug APKs
        if: ${{ inputs.build_type == 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: mys-debug-apks
          path: build/app/outputs/flutter-apk/*-debug.apk

      # Upload Release APKs
      - name: Upload Release APKs
        if: ${{ inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: mys-release-apks
          path: build/app/outputs/flutter-apk/*-release.apk

      # Upload AAB
      - name: Upload Release AAB
        if: ${{ inputs.build_type == 'bundle' }}
        uses: actions/upload-artifact@v4
        with:
          name: mys-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
